name: Check PostHTML
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - master
  workflow_dispatch:
env:
  CI: true

jobs:
  check:
    name: Check (Node 24)
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Set Node.js version
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: |
            coverage/lcov.info
            coverage/lcov-report/
          if-no-files-found: error

      - name: Pack PostHTML
        run: |
          mkdir artifacts
          npm pack --ignore-scripts --pack-destination artifacts

      - name: Upload npm package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error

  runtime:
    name: Packed Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22.12.0, 22, 24, 26]
    steps:
      - name: Clone repository
        uses: actions/checkout@v7.0.1

      - name: Set Node.js version
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Download npm package
        uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: artifacts

      - name: Run the complete suite against the production package
        run: npm run test:packed -- artifacts/posthtml-*.tgz
